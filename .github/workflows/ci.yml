name: CI

# Pushes laufen nur auf main; Feature-Branches werden über ihren Pull Request geprüft.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter liest die geänderten Dateien eines PR über die API

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Prüft auf PRs, ob die Desktop-App betroffen ist. Auf main laufen alle Desktop-Jobs immer.
  changes:
    name: Änderungen erkennen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              - 'apps/desktop/**'
              - '**/Cargo.*'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  # Linux-Build läuft immer (günstig, deckt Kompilierung, fmt und clippy ab).
  rust-linux:
    name: Desktop (Rust, ubuntu-latest)
    runs-on: ubuntu-latest
    defaults: &rust-defaults
      run:
        working-directory: apps/desktop/src-tauri
    steps: &rust-steps
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Systembibliotheken für Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # Tauri bettet die gebaute Oberfläche beim Kompilieren ein.
      - run: pnpm turbo run build --filter @timelog/desktop
        working-directory: .
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Windows und macOS sind teuer (Minuten-Faktor 2 bzw. 10). Auf PRs nur, wenn die Desktop-App
  # betroffen ist. Eigene Jobs statt Matrix, damit ein übersprungener Job unter seinem echten
  # Namen als „skipped“ gemeldet wird und Required Checks den Merge nicht blockieren.
  rust-windows:
    name: Desktop (Rust, windows-latest)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.desktop == 'true') }}
    runs-on: windows-latest
    defaults: *rust-defaults
    steps: *rust-steps

  rust-macos:
    name: Desktop (Rust, macos-latest)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.desktop == 'true') }}
    runs-on: macos-latest
    defaults: *rust-defaults
    steps: *rust-steps
