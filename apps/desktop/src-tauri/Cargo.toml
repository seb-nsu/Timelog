[package]
name = "timelog-desktop"
version = "0.1.0"
edition = "2021"
description = "TimeLog Desktop: automatische Arbeitszeiterfassung im Tray"
license = "UNLICENSED"
publish = false

[lib]
name = "timelog_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
iana-time-zone = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
timelog-core = { path = "core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_EventLog",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSApplication",
  "NSResponder",
  "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFArray",
  "CFDictionary",
  "CFString",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSAppleEventDescriptor",
  "NSAppleEventManager",
  "NSDistributedNotificationCenter",
  "NSNotification",
  "NSOperation",
  "NSString",
] }
objc2-system-configuration = { version = "0.3", default-features = false, features = [
  "std",
  "SCDynamicStore",
  "SCDynamicStoreKey",
  "SCNetworkConfiguration",
] }

[lints.rust]
# Nur die Plattform-Module erlauben `unsafe` für Systemaufrufe.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"

[workspace]
members = ["core"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
