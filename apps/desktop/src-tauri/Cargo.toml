[package]
name = "timelog-desktop"
version = "0.1.0"
edition = "2021"
description = "TimeLog Desktop: automatische Arbeitszeiterfassung im Tray"
license = "UNLICENSED"
publish = false

[lib]
name = "timelog_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
iana-time-zone = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
timelog-core = { path = "core" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"

[workspace]
members = ["core"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
