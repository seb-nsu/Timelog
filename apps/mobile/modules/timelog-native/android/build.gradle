// Lokales Expo-Modul: Netz-Erkennung (ConnectivityManager + WorkManager) und Widget (Glance).
// Compose-Plugin wie bei @expo/ui (expo-module.config.json: coreFeatures "compose").
buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'de.timelog.mobile'
version = '0.1.0'

android {
  namespace "de.timelog.mobile.detect"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  buildFeatures {
    compose true
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.work:work-runtime:2.12.0'
  implementation 'androidx.glance:glance-appwidget:1.2.0'
  implementation 'androidx.glance:glance-material3:1.2.0'

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
